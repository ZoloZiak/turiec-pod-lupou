name: Council Procedural Refresh

# Precompute procedurálnych dejov zastupiteľstva MsZ Martin zo ZÁPISNÍC:
# padnuté kvórum, stiahnuté body z programu, počet pozmeňovákov.
#
# DÔLEŽITÉ (poučenie z prvého behu): tento job NESŤAHUJE z martin.sk — martin.sk blokuje
# GitHub datacentrové IP (urlopen timeout), čo pri prvom pokuse viedlo k spracovaniu 0
# zápisníc a prepísaniu dobrých dát prázdnymi. Preto:
#   - Zdroj = VERZIOVANÝ korpus scripts/zapisnice_txt/*.txt (extrahovaný text zápisníc).
#   - Skript beží v default (parse) režime: bez siete, bez PyMuPDF, deterministicky.
#   - Má zabudovanú poistku (exit 1), ak by parse spadol pod minimum → žiadny prázdny commit.
# Sťahovanie nových zápisníc z martin.sk sa robí LOKÁLNE z Macu
# (`python3 scripts/build_council_procedural.py --download`), kde martin.sk odpovedá,
# a nový text sa commitne do korpusu. Tento workflow potom len prepočíta JSON.

on:
  schedule:
    # Raz mesačne, 2. deň o 05:00 UTC
    - cron: '0 5 2 * *'
  workflow_dispatch:
    # Manuálne spustenie z GitHub Actions tabu

# Auto-commit výsledku späť do repa vyžaduje zápisové právo na obsah
permissions:
  contents: write

jobs:
  refresh-procedural:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build procedural dataset (parse versioned corpus, no network)
        run: python scripts/build_council_procedural.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/council-interrupted.json
          if git diff --staged --quiet; then
            echo "Procedurálne dáta bez zmeny — nič sa necommituje."
          else
            git commit -m "chore(council): automatická obnova procedurálnych dejov zo zápisníc [skip ci]"
            git push
            echo "Procedurálne dáta aktualizované a pushnuté."
          fi
