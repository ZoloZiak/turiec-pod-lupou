name: Krtko Scraper Cron

on:
  schedule:
    # Spustí sa každý deň o 02:00 ráno
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Umožňuje manuálne spustenie z GitHub Actions UI

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Krtko (CRZ + PDF Scrapers)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run krtko:all
